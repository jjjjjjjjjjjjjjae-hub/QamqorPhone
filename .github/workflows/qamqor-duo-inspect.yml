name: Build and test Qamqor iPhone Duo

on:
  push:
    branches: [main]
    paths:
      - "iPhone duo.glb"
      - "index.html"
      - "duo-request.js"
      - "scripts/inspect_duo_model.py"
      - "scripts/build_duo_request_button.py"
      - ".github/workflows/qamqor-duo-inspect.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qamqor-duo-production
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install model and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install numpy trimesh pygltflib pillow playwright
          python -m playwright install --with-deps chromium
      - name: Build request button on the measured Duo inner display
        run: python scripts/build_duo_request_button.py
      - name: Inspect source Duo geometry
        run: python scripts/inspect_duo_model.py
      - name: Start local site server
        run: |
          python -m http.server 8765 --directory . > /tmp/qamqor-http.log 2>&1 &
          echo $! > /tmp/qamqor-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qamqor-http.log
          exit 1
      - name: Test Duo open-close animation, outer CTA, and repair form
        run: |
          mkdir -p diagnostics/duo
          python - <<'PY'
          import json, pathlib, traceback
          from playwright.sync_api import sync_playwright

          errors = []
          result = {"model":"QAMQOR-iPhone-Duo.glb","checks":{},"browser_errors":errors}
          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox","--disable-dev-shm-usage"]
                  )
                  page = browser.new_page(
                      viewport={"width":1440,"height":1000},
                      device_scale_factor=1
                  )
                  page.on("pageerror",lambda e: errors.append(str(e)))
                  page.goto(
                      "http://127.0.0.1:8765/index.html",
                      wait_until="domcontentloaded",
                      timeout=90000
                  )
                  page.wait_for_function("""() => {
                    const v=document.querySelector('.qamqor-phone-model');
                    return v && v.loaded && window.qamqorPhoneForm &&
                      window.qamqorPhoneForm.getState()==='closed';
                  }""",timeout=120000)

                  lock_art = json.loads(pathlib.Path("qamqor-duo-button-build.json").read_text(encoding="utf-8"))
                  initial = page.evaluate("""() => {
                    const v=document.querySelector('.qamqor-phone-model');
                    const mat=v.model && v.model.getMaterialByName('QAMQOR_Duo_Closed_Display');
                    const overlay=document.getElementById('qamqor-phone-form-overlay');
                    const lockPlane=document.getElementById('qamqor-lock-click-plane');
                    const hit=document.getElementById('qamqor-lock-click-button');
                    const box=hit && hit.getBoundingClientRect();
                    return {
                      src:v.getAttribute('src'),
                      loaded:v.loaded,
                      animations:v.availableAnimations,
                      duration:v.duration,
                      currentTime:v.currentTime,
                      state:window.qamqorPhoneForm.getState(),
                      outerMaterial:mat ? {
                        name:mat.name,
                        loaded:mat.isLoaded,
                        emissive:mat.emissiveFactor
                      } : null,
                      overlayHidden:overlay.hidden,
                      lockPlaneHidden:!lockPlane || lockPlane.hidden,
                      physicalButtonVisible:!!box && box.width>20 && box.height>15,
                      buttonBounds:box ? {x:box.x,y:box.y,width:box.width,height:box.height} : null,
                      viewer:{width:v.clientWidth,height:v.clientHeight}
                    };
                  }""")
                  result["initial_state"]=initial
                  result["checks"]["duo_asset_loaded"]="QAMQOR-iPhone-Duo.glb" in (initial.get("src") or "")
                  result["checks"]["open_close_animation_preserved"]="open-close" in initial.get("animations",[])
                  closed_pose_time=initial.get("duration",0)-min(
                    0.05,initial.get("duration",0)*0.025
                  )
                  result["checks"]["starts_in_closed_pose"]=(
                    initial.get("duration",0)>0 and
                    abs(initial.get("currentTime",0)-closed_pose_time)<0.08 and
                    initial.get("state")=="closed"
                  )
                  result["checks"]["closed_screen_art_material_present"]=bool(
                    initial.get("outerMaterial") and
                    initial["outerMaterial"]["name"]=="QAMQOR_Duo_Closed_Display"
                  )
                  result["checks"]["lock_screen_texture_and_button_baked_into_glb"]=(
                    lock_art.get("lock_screen_artwork") is True and
                    lock_art.get("physical_request_button_box_px")==[82,835,686,965] and
                    initial.get("physicalButtonVisible") and
                    initial.get("overlayHidden") and
                    not initial.get("lockPlaneHidden")
                  )

                  page.locator(".qamqor-phone-model").screenshot(
                    path="diagnostics/duo/duo-closed-lock-screen.png"
                  )

                  # Click the screen-projected target exactly over the baked visible lock CTA.
                  hitbox=page.locator("#qamqor-lock-click-button")
                  hit=hitbox.bounding_box()
                  if not hit or hit["width"]<20 or hit["height"]<15:
                    raise RuntimeError("The lock-screen Өтінім беру click target is missing.")
                  page.mouse.click(hit["x"]+hit["width"]/2,hit["y"]+hit["height"]/2)
                  page.wait_for_function("""() => {
                    const o=document.getElementById('qamqor-phone-form-overlay');
                    const f=document.getElementById('repair');
                    return window.qamqorPhoneForm &&
                      window.qamqorPhoneForm.getState()==='form' &&
                      window.qamqorPhoneForm.isOpen() &&
                      o && !o.hidden && o.contains(f);
                  }""",timeout=15000)

                  opened = page.evaluate("""() => {
                    const v=document.querySelector('.qamqor-phone-model');
                    const r=window.qamqorPhoneForm.getScreenRect();
                    const o=document.getElementById('qamqor-phone-form-overlay');
                    return {
                      state:window.qamqorPhoneForm.getState(),
                      currentTime:v.currentTime,
                      duration:v.duration,
                      formInsideOverlay:o.contains(document.getElementById('repair')),
                      cameraControls:v.hasAttribute('camera-controls'),
                      innerScreenRect:r
                    };
                  }""")
                  result["opened_state"]=opened
                  result["checks"]["physical_lock_screen_button_opens_duo_and_form"]=(
                    opened["state"]=="form" and opened["currentTime"]<0.08 and
                    opened["formInsideOverlay"] and opened["innerScreenRect"] is not None
                  )
                  result["checks"]["camera_controls_enabled_for_form"]=opened["cameraControls"]
                  page.locator("#qamqor-phone-form-overlay").screenshot(
                    path="diagnostics/duo/duo-inner-request-form.png"
                  )

                  # Drag the non-interactive heading area and capture diagnostics.
                  heading=page.locator("#repair .cardhead").bounding_box()
                  if not heading:
                    raise RuntimeError("The attached request form heading is not visible.")
                  before_drag=page.evaluate("""() => {
                    const v=document.querySelector('.qamqor-phone-model');
                    return {
                      theta:v.getCameraOrbit().theta,
                      matrix:window.qamqorPhoneForm.getScreenRect()?.matrix,
                      overlayRect:document.getElementById('qamqor-phone-form-overlay').getBoundingClientRect().toJSON()
                    };
                  }""")
                  page.evaluate("theta => window.__qamqorBeforeDragTheta=theta",before_drag["theta"])
                  start_x=heading["x"]+heading["width"]*0.52
                  start_y=heading["y"]+heading["height"]*0.52
                  page.mouse.move(start_x,start_y)
                  page.mouse.down()
                  page.mouse.move(start_x+62,start_y+4,steps=5)
                  page.mouse.up()
                  drag_wait_error=None
                  try:
                    page.wait_for_function("""() => {
                      const v=document.querySelector('.qamqor-phone-model');
                      const o=document.getElementById('qamqor-phone-form-overlay');
                      const r=window.qamqorPhoneForm.getScreenRect();
                      return v && o && !o.hidden && r && (() => {
                        const nums = value => String(value || "").slice(9,-1).split(",").map(Number);
                        const actual = nums(o.style.transform);
                        const expected = nums(r.matrix);
                        return actual.length===16 && expected.length===16 &&
                          actual.every((value,index)=>Math.abs(value-expected[index])<0.002);
                      })() &&
                        Math.abs(v.getCameraOrbit().theta-window.__qamqorBeforeDragTheta)>0.05;
                    }""",timeout=4000)
                  except Exception as exc:
                    drag_wait_error=str(exc)

                  after_drag=page.evaluate("""() => {
                    const v=document.querySelector('.qamqor-phone-model');
                    const o=document.getElementById('qamqor-phone-form-overlay');
                    const r=window.qamqorPhoneForm.getScreenRect();
                    const nums = value => String(value || "").slice(9,-1).split(",").map(Number);
                    const actual = nums(o.style.transform);
                    const expected = nums(r?.matrix || "");
                    return {
                      theta:v.getCameraOrbit().theta,
                      matrix:r && r.matrix,
                      overlayTransform:o.style.transform,
                      matrixAligned:actual.length===16 && expected.length===16 &&
                        actual.every((value,index)=>Math.abs(value-expected[index])<0.002),
                      debug:window.qamqorPhoneForm.getRotationDebug()
                    };
                  }""")
                  result["rotation_drag"]={
                    "before":before_drag,
                    "after":after_drag,
                    "wait_error":drag_wait_error,
                    "heading_box":heading
                  }
                  result["checks"]["drag_rotates_phone_and_form_follows"] = (
                    abs(after_drag["theta"]-before_drag["theta"])>0.05 and
                    after_drag["matrix"] is not None and
                    after_drag["matrixAligned"]
                  )

                  # Turn the inner display away: the projected form must disappear,
                  # then return to precisely the screen when the phone faces front again.
                  current_orbit=page.evaluate("""() => {
                    const o=document.querySelector('.qamqor-phone-model').getCameraOrbit();
                    return {theta:o.theta,phi:o.phi,radius:o.radius};
                  }""")
                  page.evaluate("""o => {
                    const v=document.querySelector('.qamqor-phone-model');
                    v.cameraOrbit=(o.theta+Math.PI)+'rad '+o.phi+'rad '+o.radius+'m';
                  }""",current_orbit)
                  page.wait_for_function("""() => {
                    const o=document.getElementById('qamqor-phone-form-overlay');
                    return o && o.hidden;
                  }""",timeout=10000)
                  result["checks"]["form_hides_when_screen_faces_away"]=True
                  page.evaluate("""o => {
                    const v=document.querySelector('.qamqor-phone-model');
                    v.cameraOrbit=o.theta+'rad '+o.phi+'rad '+o.radius+'m';
                  }""",current_orbit)
                  page.wait_for_function("""() => {
                    const o=document.getElementById('qamqor-phone-form-overlay');
                    const r=window.qamqorPhoneForm.getScreenRect();
                    return o && !o.hidden && r && (() => {
                        const nums = value => String(value || "").slice(9,-1).split(",").map(Number);
                        const actual = nums(o.style.transform);
                        const expected = nums(r.matrix);
                        return actual.length===16 && expected.length===16 &&
                          actual.every((value,index)=>Math.abs(value-expected[index])<0.002);
                      })();
                  }""",timeout=10000)
                  result["checks"]["form_returns_when_screen_faces_camera"]=True

                  page.locator("#repair").screenshot(
                    path="diagnostics/duo/duo-open-form.png"
                  )

                  page.locator("#brand").fill("iPhone Duo")
                  page.locator("[data-wizard-next]").first.click()
                  page.wait_for_function("""() => {
                    const step=document.querySelector('#repair [data-wizard-step="1"]');
                    return step && !step.hidden &&
                      document.getElementById('qamqor-phone-form-overlay').contains(document.getElementById('repair'));
                  }""")
                  result["checks"]["wizard_works_inside_open_duo"]=page.evaluate("""() =>
                    window.qamqorPhoneForm.getState()==='form' &&
                    !document.querySelector('#repair [data-wizard-step="1"]').hidden
                  """)

                  # Trigger the close control and capture its final state after the 2-second clip.
                  page.locator(".qamqor-phone-form-close").evaluate("(button) => button.click()")
                  page.wait_for_timeout(4500)
                  closed_again=page.evaluate("""() => {
                    const v=document.querySelector('.qamqor-phone-model');
                    const f=document.getElementById('repair');
                    const o=document.getElementById('qamqor-phone-form-overlay');
                    return {
                      state:window.qamqorPhoneForm.getState(),
                      open:window.qamqorPhoneForm.isOpen(),
                      currentTime:v.currentTime,
                      duration:v.duration,
                      timeScale:v.timeScale,
                      paused:v.paused,
                      cameraControls:v.hasAttribute('camera-controls'),
                      formHidden:f.hidden,
                      overlayHidden:o.hidden
                    };
                  }""")
                  result["closed_again_state"]=closed_again
                  closed_pose_time = closed_again["duration"] - min(
                    0.05, closed_again["duration"] * 0.025
                  )
                  result["checks"]["close_returns_to_folded_lock_screen"]=(
                    closed_again["state"]=="closed" and
                    not closed_again["open"] and
                    abs(closed_again["currentTime"]-closed_pose_time)<0.08 and
                    closed_again["cameraControls"] and
                    closed_again["formHidden"] and
                    closed_again["overlayHidden"]
                  )
                  page.locator(".qamqor-phone-model").screenshot(
                    path="diagnostics/duo/duo-closed-again.png"
                  )

                  # Record the real 3D ray result and try the fallback without
                  # making this optional path block the required mobile test.
                  fallback_box = page.locator("#qamqor-lock-click-button").bounding_box()
                  if not fallback_box:
                    raise RuntimeError("Cannot measure the folded screen CTA for ray fallback.")
                  fallback_x = fallback_box["x"] + fallback_box["width"] / 2
                  fallback_y = fallback_box["y"] + fallback_box["height"] / 2
                  ray_probe = page.evaluate("""({x,y}) => {
                    const v=document.querySelector('.qamqor-phone-model');
                    const h=v.positionAndNormalFromPoint(x,y);
                    const m=v.materialFromPoint(x,y);
                    return {
                      hit:h ? {
                        position:{x:h.position.x,y:h.position.y,z:h.position.z},
                        normal:h.normal ? {x:h.normal.x,y:h.normal.y,z:h.normal.z} : null,
                        uv:h.uv ? {x:h.uv.x,y:h.uv.y} : null
                      } : null,
                      material:m ? m.name : null
                    };
                  }""", {"x":fallback_x,"y":fallback_y})
                  result["ray_probe"] = ray_probe
                  page.evaluate("""() => {
                    document.getElementById("qamqor-lock-click-plane").hidden = true;
                  }""")
                  page.mouse.click(fallback_x, fallback_y)
                  ray_opened = False
                  try:
                    page.wait_for_function("""() => {
                      const o=document.getElementById('qamqor-phone-form-overlay');
                      return window.qamqorPhoneForm &&
                        window.qamqorPhoneForm.getState()==='form' &&
                        o && !o.hidden && o.contains(document.getElementById('repair'));
                    }""", timeout=6000)
                    ray_opened = True
                  except Exception:
                    ray_opened = False
                  result["ray_hit_fallback"] = {
                    "opened":ray_opened,
                    "diagnostics":page.evaluate("() => window.qamqorPhoneForm.getDiagnostics()")
                  }
                  if ray_opened:
                    page.locator(".qamqor-phone-form-close").click()
                    page.wait_for_function("""() =>
                      window.qamqorPhoneForm &&
                      window.qamqorPhoneForm.getState()==='closed'
                    """, timeout=15000)

                  # Test the actual phone-sized touchscreen viewport as well.
                  mobile = browser.new_page(
                    viewport={"width":390,"height":844},
                    device_scale_factor=3,
                    is_mobile=True,
                    has_touch=True
                  )
                  mobile.on("pageerror", lambda e: errors.append("mobile: " + str(e)))
                  mobile.goto(
                    "http://127.0.0.1:8765/index.html",
                    wait_until="domcontentloaded",
                    timeout=90000
                  )
                  mobile.wait_for_function("""() => {
                    const v=document.querySelector('.qamqor-phone-model');
                    return v && v.loaded && window.qamqorPhoneForm &&
                      window.qamqorPhoneForm.getState()==='closed' &&
                      window.qamqorPhoneForm.isLockButtonVisible();
                  }""", timeout=120000)
                  mobile_hit = mobile.locator("#qamqor-lock-click-button").bounding_box()
                  if not mobile_hit or mobile_hit["width"] < 20 or mobile_hit["height"] < 15:
                    raise RuntimeError("Mobile folded-screen CTA target is too small or missing.")
                  mobile.touchscreen.tap(
                    mobile_hit["x"] + mobile_hit["width"] / 2,
                    mobile_hit["y"] + mobile_hit["height"] / 2
                  )
                  mobile.wait_for_function("""() => {
                    const o=document.getElementById('qamqor-phone-form-overlay');
                    return window.qamqorPhoneForm &&
                      window.qamqorPhoneForm.getState()==='form' &&
                      o && !o.hidden && o.contains(document.getElementById('repair'));
                  }""", timeout=15000)
                  result["mobile_state"] = mobile.evaluate("""() => ({
                    state:window.qamqorPhoneForm.getState(),
                    formInsideOverlay:document.getElementById('qamqor-phone-form-overlay')
                      .contains(document.getElementById('repair')),
                    buttonVisible:window.qamqorPhoneForm.isLockButtonVisible(),
                    diagnostics:window.qamqorPhoneForm.getDiagnostics()
                  })""")
                  result["checks"]["mobile_touch_opens_form_inside_duo"] = (
                    result["mobile_state"]["state"] == "form" and
                    result["mobile_state"]["formInsideOverlay"]
                  )
                  mobile.locator(".qamqor-phone-form-close").click()
                  mobile.wait_for_function("""() =>
                    window.qamqorPhoneForm &&
                    window.qamqorPhoneForm.getState()==='closed'
                  """, timeout=15000)
                  mobile.close()
                  browser.close()
          except Exception as e:
              result["error"]=str(e)
              result["traceback"]=traceback.format_exc()

          pathlib.Path("qamqor-duo-browser-test.json").write_text(
            json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8"
          )
          print("QAMQOR_DUO_BROWSER_TEST="+json.dumps(result,ensure_ascii=False))
          failed=[k for k,v in result["checks"].items() if v is not True]
          if failed or errors or result.get("error"):
              raise SystemExit("Duo animation tests failed: "+", ".join(failed))
          PY
      - name: Upload Duo preview screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qamqor-duo-preview
          path: |
            diagnostics/duo/
            qamqor-duo-browser-test.json
          if-no-files-found: warn
          retention-days: 14
      - name: Commit generated Duo model and reports
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QAMQOR-iPhone-Duo.glb qamqor-duo-button-build.json qamqor-duo-model-report.json qamqor-duo-browser-test.json
          if git diff --cached --quiet; then
            echo "No generated Duo assets or report changes."
          else
            git commit -m "chore: build and verify Qamqor iPhone Duo model"
            git push
          fi
