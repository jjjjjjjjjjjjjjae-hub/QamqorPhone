name: Qamqor 3D diagnostics

on:
  push:
    branches: [main]
    paths:
      - "kor.html"
      - "index.html"
      - "iPhone 18 pro max.glb"
      - "scripts/build_phone_button.py"
      - ".github/workflows/qamqor-3d-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qamqor-3d-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install diagnostics and font dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install numpy trimesh pygltflib pillow playwright
          python -m playwright install --with-deps chromium

      - name: Build a physical 3D request button into the GLB
        run: python scripts/build_phone_button.py

      - name: Start local web server
        run: |
          python -m http.server 8765 --directory . > /tmp/qamqor-http.log 2>&1 &
          echo $! > /tmp/qamqor-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qamqor-http.log
          exit 1

      - name: Test GLB geometry and button rotation in Chromium
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p diagnostics/screenshots
          python - <<'PY'
          import json
          import math
          import os
          import pathlib
          import time
          import traceback

          import numpy as np
          import trimesh
          from playwright.sync_api import sync_playwright

          root = pathlib.Path(".")
          generated = root / "QAMQOR-iPhone-18-Pro-Max.glb"
          report = {
              "repository": "jjjjjjjjjjjjjjae-hub/QamqorPhone",
              "commit": os.environ.get("GITHUB_SHA"),
              "branch": os.environ.get("GITHUB_REF_NAME"),
              "generated_at_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "button_build": {},
              "glb_geometry": {},
              "visual_rotation_test": {},
              "browser_errors": []
          }

          if (root / "qamqor-3d-button-build.json").exists():
              report["button_build"] = json.loads(
                  (root / "qamqor-3d-button-build.json").read_text(encoding="utf-8")
              )

          # Independently reopen the exact model that index.html will load.
          try:
              scene = trimesh.load(str(generated), force="scene", process=False)
              node_rows = []
              button_meshes = []
              for node_name in list(scene.graph.nodes_geometry):
                  transform, geometry_name = scene.graph.get(node_name)
                  geom = scene.geometry[geometry_name]
                  vertices = trimesh.transform_points(np.asarray(geom.vertices), transform)
                  material = getattr(getattr(geom, "visual", None), "material", None)
                  material_name = getattr(material, "name", None) if material else None
                  row = {
                      "node": str(node_name),
                      "mesh": str(geometry_name),
                      "material": material_name,
                      "vertex_count": int(len(geom.vertices)),
                      "face_count": int(len(getattr(geom, "faces", []))),
                      "bounds_min": vertices.min(axis=0).tolist() if len(vertices) else None,
                      "bounds_max": vertices.max(axis=0).tolist() if len(vertices) else None
                  }
                  node_rows.append(row)
                  if "QAMQOR_Request_Button" in str(node_name) or "QAMQOR_Request_Button" in str(geometry_name):
                      button_meshes.append(row)

              report["glb_geometry"] = {
                  "file": generated.name,
                  "file_size_bytes": generated.stat().st_size,
                  "geometry_count": len(scene.geometry),
                  "button_mesh_count": len(button_meshes),
                  "button_meshes": button_meshes,
                  "geometry": node_rows
              }
          except Exception as exc:
              report["glb_geometry"] = {
                  "error": str(exc),
                  "traceback": traceback.format_exc()
              }

          # Render and test the actual production page, not just the diagnostic page.
          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox", "--disable-dev-shm-usage"]
                  )
                  page = browser.new_page(
                      viewport={"width": 1440, "height": 1000},
                      device_scale_factor=1
                  )
                  page.on("pageerror", lambda exc: report["browser_errors"].append(str(exc)))
                  page.goto(
                      "http://127.0.0.1:8765/index.html",
                      wait_until="domcontentloaded",
                      timeout=90000
                  )
                  page.wait_for_function(
                      """() => {
                        const v = document.querySelector('.qamqor-phone-model');
                        return v && v.loaded &&
                          typeof v.queryHotspot === 'function' &&
                          typeof v.positionAndNormalFromPoint === 'function';
                      }""",
                      timeout=120000
                  )

                  # Add invisible 3D coordinate probes around the real button mesh.
                  # They let Chromium measure the physical plane's perspective at every angle.
                  page.evaluate(
                      """() => {
                        const v = document.querySelector('.qamqor-phone-model');
                        const points = {
                          'hotspot-button-center': [0, 0.0531068, 0.004502],
                          'hotspot-button-left': [-0.02629, 0.0531068, 0.004502],
                          'hotspot-button-right': [0.02629, 0.0531068, 0.004502],
                          'hotspot-button-top': [0, 0.0596795, 0.004502],
                          'hotspot-button-bottom': [0, 0.0465341, 0.004502]
                        };
                        for (const [slot, p] of Object.entries(points)) {
                          const el = document.createElement('span');
                          el.slot = slot;
                          el.setAttribute('data-position', p.join(' '));
                          el.setAttribute('data-normal', '0 0 1');
                          el.setAttribute('aria-hidden', 'true');
                          el.style.cssText = 'width:1px;height:1px;opacity:0;pointer-events:none';
                          v.appendChild(el);
                        }
                      }"""
                  )

                  # Test frontal, oblique, edge-on and rear views, rather than only 0/180.
                  angles = [0, 15, 30, 45, 60, 75, 85, 89, 90, 91, 95, 105, 120, 135, 150, 165, 180, 210, 240, 270]
                  tests = []
                  for angle in angles:
                      state = page.evaluate(
                          """async (degrees) => {
                            const v = document.querySelector('.qamqor-phone-model');
                            const initial = v.getCameraOrbit();
                            const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
                            const theta = degrees * Math.PI / 180;
                            v.cameraOrbit = theta + 'rad ' + initial.phi + 'rad ' + initial.radius + 'm';
                            await pause(450);
                            const names = [
                              'hotspot-button-center',
                              'hotspot-button-left',
                              'hotspot-button-right',
                              'hotspot-button-top',
                              'hotspot-button-bottom'
                            ];
                            const probes = {};
                            for (const name of names) {
                              const h = v.queryHotspot(name);
                              probes[name] = h ? {
                                facingCamera: h.facingCamera,
                                position: {x:h.position.x,y:h.position.y,z:h.position.z},
                                canvasPosition: {x:h.canvasPosition.x,y:h.canvasPosition.y,z:h.canvasPosition.z}
                              } : null;
                            }
                            const rect = v.getBoundingClientRect();
                            const center = probes['hotspot-button-center'];
                            let rayHits = null;
                            if (center) {
                              const x = rect.left + center.canvasPosition.x;
                              const y = rect.top + center.canvasPosition.y;
                              const globalHit = v.positionAndNormalFromPoint(x, y);
                              const localHit = v.positionAndNormalFromPoint(center.canvasPosition.x, center.canvasPosition.y);
                              const pack = h => h ? {
                                position:{x:h.position.x,y:h.position.y,z:h.position.z},
                                normal:{x:h.normal.x,y:h.normal.y,z:h.normal.z}
                              } : null;
                              rayHits = {
                                global: pack(globalHit),
                                local: pack(localHit),
                                rect:{left:rect.left,top:rect.top,width:rect.width,height:rect.height}
                              };
                            }
                            const left = probes['hotspot-button-left'];
                            const right = probes['hotspot-button-right'];
                            let projectedWidth = null;
                            if (left && right) {
                              projectedWidth = Math.hypot(
                                right.canvasPosition.x-left.canvasPosition.x,
                                right.canvasPosition.y-left.canvasPosition.y
                              );
                            }
                            return {
                              angle:degrees,
                              facingCamera:center ? center.facingCamera : null,
                              center,
                              projectedButtonWidthPx:projectedWidth,
                              probes,
                              rayHits
                            };
                          }""",
                          angle
                      )
                      tests.append(state)

                      if angle in [0, 30, 45, 60, 75, 89, 91, 135, 180]:
                          page.locator(".qamqor-phone-model").screenshot(
                              path="diagnostics/screenshots/desktop-%03d.png" % angle
                          )

                  # Test touch-sized/mobile rendering with the same real GLB mesh.
                  mobile = browser.new_page(
                      viewport={"width":390,"height":844},
                      device_scale_factor=1
                  )
                  mobile.on("pageerror", lambda exc: report["browser_errors"].append("mobile: "+str(exc)))
                  mobile.goto(
                      "http://127.0.0.1:8765/index.html",
                      wait_until="domcontentloaded",
                      timeout=90000
                  )
                  mobile.wait_for_function(
                      "() => { const v=document.querySelector('.qamqor-phone-model'); return v && v.loaded; }",
                      timeout=120000
                  )
                  mobile_state = mobile.evaluate(
                      """async () => {
                        const v=document.querySelector('.qamqor-phone-model');
                        const o=v.getCameraOrbit();
                        v.cameraOrbit='0rad '+o.phi+'rad '+o.radius+'m';
                        await new Promise(r=>setTimeout(r,400));
                        const h=v.queryHotspot('hotspot-probe');
                        return h ? {
                          facingCamera:h.facingCamera,
                          canvasPosition:{x:h.canvasPosition.x,y:h.canvasPosition.y},
                          viewerSize:{width:v.clientWidth,height:v.clientHeight}
                        } : null;
                      }"""
                  )
                  mobile.locator(".qamqor-phone-model").screenshot(
                      path="diagnostics/screenshots/mobile-front.png"
                  )

                  # A real click on the projected 3D button center must navigate to the request form.
                  page.evaluate(
                      """async () => {
                        const v=document.querySelector('.qamqor-phone-model');
                        const o=v.getCameraOrbit();
                        v.cameraOrbit='0rad '+o.phi+'rad '+o.radius+'m';
                        await new Promise(r=>setTimeout(r,400));
                      }"""
                  )
                  center = page.evaluate(
                      """() => {
                        const v=document.querySelector('.qamqor-phone-model');
                        const h=v.queryHotspot('hotspot-button-center');
                        const r=v.getBoundingClientRect();
                        return h ? {x:r.left+h.canvasPosition.x,y:r.top+h.canvasPosition.y} : null;
                      }"""
                  )
                  if center:
                      page.mouse.click(center["x"], center["y"])
                      page.wait_for_timeout(500)
                  click_test = page.evaluate("() => location.hash")

                  report["visual_rotation_test"] = {
                      "angles": tests,
                      "mobile_front": mobile_state,
                      "front_button_click_hash": click_test,
                      "screenshots": sorted(str(p) for p in pathlib.Path("diagnostics/screenshots").glob("*.png")),
                      "interpretation": {
                          "button_is_real_glb_mesh": len(report["glb_geometry"].get("button_meshes", [])) > 0,
                          "front_visible": next((x["facingCamera"] for x in tests if x["angle"] == 0), None),
                          "back_hidden": next((not x["facingCamera"] for x in tests if x["angle"] == 180), None),
                          "projected_width_at_front": next((x["projectedButtonWidthPx"] for x in tests if x["angle"] == 0), None),
                          "projected_width_at_side": next((x["projectedButtonWidthPx"] for x in tests if x["angle"] == 89), None),
                          "click_reached_request_form": click_test == "#repair"
                      }
                  }
                  browser.close()
          except Exception as exc:
              report["visual_rotation_test"] = {
                  "error": str(exc),
                  "traceback": traceback.format_exc()
              }

          report_path = root / "qamqor-3d-report.json"
          report_path.write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          summary = {
              "generated_at_utc": report["generated_at_utc"],
              "button_mesh_count": report.get("glb_geometry", {}).get("button_mesh_count"),
              "front_visible": report.get("visual_rotation_test", {}).get("interpretation", {}).get("front_visible"),
              "back_hidden": report.get("visual_rotation_test", {}).get("interpretation", {}).get("back_hidden"),
              "projected_width_at_front": report.get("visual_rotation_test", {}).get("interpretation", {}).get("projected_width_at_front"),
              "projected_width_at_side": report.get("visual_rotation_test", {}).get("interpretation", {}).get("projected_width_at_side"),
              "click_reached_request_form": report.get("visual_rotation_test", {}).get("interpretation", {}).get("click_reached_request_form"),
              "browser_errors": report["browser_errors"]
          }
          print("QAMQOR_3D_QA_SUMMARY=" + json.dumps(summary, ensure_ascii=False))
          PY

      - name: Upload rotation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qamqor-3d-rotation-screenshots
          path: diagnostics/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated 3D model and QA report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QAMQOR-iPhone-18-Pro-Max.glb qamqor-3d-button-build.json qamqor-3d-report.json
          if git diff --cached --quiet; then
            echo "No generated model/report changes to commit."
          else
            git commit -m "chore: generate physical 3D request button and QA report"
            git push
          fi
