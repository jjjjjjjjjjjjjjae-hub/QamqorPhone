<script id="qamqor-embedded-ios13-init">
(() => {
  const phone = document.querySelector(".iphone-7");
  const pages = document.querySelector(".pages");
  const root = document.documentElement;

  const setResponsiveUI = () => {
    const width = window.visualViewport?.width || root.clientWidth || window.innerWidth;
    const scale = Math.min(1, Math.max(0.76, width / 296));
    const px = value => `${Math.round(value * scale * 10) / 10}px`;
    root.style.setProperty("--ios13-icon-size", px(46));
    root.style.setProperty("--ios13-icon-radius", px(10));
    root.style.setProperty("--ios13-col-padding", px(0));
    root.style.setProperty("--ios13-row-padding", px(10));
    root.style.setProperty("--ios13-dock-height", px(70));
    root.style.setProperty("--ios13-dock-padding", px(23));
    root.style.setProperty("--ios13-dock-bottom", `-${Math.round((71 * scale) * 10) / 10}px`);
    root.style.setProperty("--ios13-status-height", px(15));
    root.style.setProperty("--ios13-status-font", px(11));
    root.style.setProperty("--ios13-status-padding", px(5));
  };

  const fitPhone = () => {
    if (!phone) return;
    const viewport = window.visualViewport;
    const width = viewport?.width || root.clientWidth || window.innerWidth;
    const height = viewport?.height || root.clientHeight || window.innerHeight;
    const scale = Math.min(
      1,
      Math.max(0.1, (width - 24) / 340),
      Math.max(0.1, (height - 24) / 695)
    );
    phone.style.setProperty("--phone-scale", scale.toFixed(4));
    setResponsiveUI();
  };

  const showHomeScreen = () => {
    const touchId = document.getElementById("touch-id");
    if (touchId) touchId.click();

    window.setTimeout(() => {
      const phoneScreen = document.querySelector(".phone-screen");
      if (phoneScreen) phoneScreen.style.opacity = "1";
      if (pages) pages.style.transform = "translate3d(-25%, 0, 0)";
      document.querySelectorAll(".home-icons .icon, .home-icons-2 .icon").forEach(icon => {
        icon.style.opacity = "1";
      });
    }, 650);
  };

  let frame = 0;
  const scheduleFit = () => {
    if (frame) cancelAnimationFrame(frame);
    frame = requestAnimationFrame(() => {
      frame = 0;
      fitPhone();
    });
  };

  fitPhone();
  showHomeScreen();
  window.addEventListener("resize", scheduleFit, {passive: true});
  window.addEventListener("orientationchange", scheduleFit, {passive: true});
  window.visualViewport?.addEventListener("resize", scheduleFit, {passive: true});
})();
</script>
