  <script>
    // Scale the complete phone to the smaller of the viewport width/height.
    // This also reacts to mobile browser chrome and orientation changes.
    (() => {
      const phone = document.querySelector('.iphone-7');
      if (!phone) return;

      const fitPhone = () => {
        const viewport = window.visualViewport;
        const width = viewport?.width || document.documentElement.clientWidth || window.innerWidth;
        const height = viewport?.height || document.documentElement.clientHeight || window.innerHeight;
        const scale = Math.min(
          1,
          Math.max(0.1, (width - 24) / 340),
          Math.max(0.1, (height - 24) / 695)
        );
        phone.style.setProperty('--phone-scale', scale.toFixed(4));
      };

      let frame = 0;
      const scheduleFit = () => {
        if (frame) cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => {
          frame = 0;
          fitPhone();
        });
      };

      fitPhone();
      window.addEventListener('resize', scheduleFit, {passive: true});
      window.addEventListener('orientationchange', scheduleFit, {passive: true});
      window.visualViewport?.addEventListener('resize', scheduleFit, {passive: true});
    })();
  </script>

<script id="qamqor-embedded-repair-bridge">
(() => {
  const button = document.getElementById("qamqorEmbeddedRepairButton");
  if (!button) return;
  button.addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
    window.parent.postMessage({type:"qamqor-open-repair"}, window.location.origin);
  });
})();
</script>
